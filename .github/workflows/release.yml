name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build release artifacts (macOS 27, arm64)
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      HOMEBREW_NO_ANALYTICS: '1'
      RESIGN_CODESIGN_IDENTITY: '-'
      RESIGN_BUILD_NUMBER: ${{ github.run_number }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version
        id: version
        run: |
          python3 - <<'PYTHON'
          import os, plistlib, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Release tags must have the form v1.0.0')
          with open('Resources/Info.plist', 'rb') as source:
              version = plistlib.load(source)['CFBundleShortVersionString']
          if tag != 'v' + version:
              raise SystemExit('Tag does not match Resources/Info.plist')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PYTHON
      - name: Prepare build environment
        run: bash scripts/ci-setup.sh
      - name: Run default tests
        run: |
          unset RESIGN_DEVICE_TEST RESIGN_INTEGRATION_URL RESIGN_GSA_PROBE
          swift test --filter ReSignTests
      - name: Build application
        run: bash scripts/build-app.sh
      - name: Package disk image, source and checksums
        run: python3 scripts/package-release.py
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ReSign-${{ steps.version.outputs.version }}-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Generate notes and create draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate release notes from commits
        run: python3 scripts/generate-release-notes.py
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ReSign-${{ needs.build.outputs.version }}-release
          path: dist/release
      - name: Verify artifact checksums
        working-directory: dist/release
        run: sha256sum --check --strict SHA256SUMS
      - name: Refuse changes to published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.error, urllib.request
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{os.environ['RELEASE_TAG']}"
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          try:
              response = urllib.request.urlopen(request, timeout=30)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              with response:
                  release = json.load(response)
              if not release['draft']:
                  raise SystemExit('Refusing to replace a published release')
          PYTHON
      - name: Create or update draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ReSign ${{ needs.build.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          draft: true
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/release/*
